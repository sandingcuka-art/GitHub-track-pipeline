services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  fetcher:
    build: .
    command: python scheduled_fetch.py
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/testdb
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: .
    command: streamlit run dashboard.py --server.address=0.0.0.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/testdb
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
